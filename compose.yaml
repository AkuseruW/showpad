services:
  api:
    profiles: ["app"]
    build: .
    ports:
      - "127.0.0.1:${API_PORT:-3000}:3000"
    environment:
      STORAGE: redis
      REDIS_URL: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - --input-type=module
        - -e
        - "const response = await fetch('http://127.0.0.1:3000/foo'); if (response.status !== 401) process.exit(1);"
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
  redis:
    image: redis:8.2-alpine
    command:
      ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1s
      timeout: 3s
      retries: 10

volumes:
  redis-data:
